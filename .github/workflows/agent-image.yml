# Builds the agent image (docs/agent-image.md): on pull requests to prove it
# builds, on main to publish it to ghcr.io/backfabric/agent (ADR 0022).
name: agent-image

on:
  pull_request:
    paths:
      - nix/images/**
      - flake.nix
      - flake.lock
      - .github/workflows/agent-image.yml
  push:
    branches: [main]
    paths:
      - nix/images/**
      - flake.nix
      - flake.lock
      - .github/workflows/agent-image.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/backfabric/agent

jobs:
  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build image
        run: nix build .#packages.x86_64-linux.agent-image
      # The supervisor starts as the agent user and answers; Codex runs.
      # Nothing here talks to OpenAI.
      - name: Run image
        run: |
          image=$(docker load <result | sed -n 's/^Loaded image: //p')
          docker image inspect --format '{{json .Config}}' "$image"
          docker run --detach --name agent --publish 8080:8080 "$image"
          trap 'docker logs agent' EXIT
          # Until the supervisor listens, docker's proxy resets connections.
          curl --silent --show-error --fail --retry 10 --retry-all-errors --retry-delay 1 localhost:8080/healthz
          curl --silent --show-error --fail localhost:8080/login | tee login.json
          jq --exit-status '.logged_in == false and .status == "Not logged in"' login.json
          docker exec agent sh -c 'id && codex --version && git --version'

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build image
        run: nix build .#packages.x86_64-linux.agent-image
      # docker's credential store (~/.docker/config.json) is read by skopeo
      # and by the attestation step.
      - name: Log in to ghcr.io
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tagged with the commit only: consumers pin the digest, and no
      # mutable tag invites pulling an unpinned image.
      - name: Push image
        id: push
        run: |
          nix run --inputs-from . nixpkgs#skopeo -- copy --digestfile digest \
            docker-archive:result "docker://$IMAGE:$GITHUB_SHA"
          digest=$(cat digest)
          echo "digest=$digest" >>"$GITHUB_OUTPUT"
          {
            echo "### Agent image"
            echo
            echo "\`$IMAGE@$digest\`"
            echo
            echo "Tag: \`$GITHUB_SHA\`"
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Linked artifacts storage records would need artifact-metadata: write.
          create-storage-record: false
