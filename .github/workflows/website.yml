# Builds the project website (website/, nix/website.nix): on pull requests to
# prove it builds, on main to publish it to GitHub Pages at
# https://backfabric.dev (ADR 0026).
name: website

on:
  pull_request:
    paths:
      - website/**
      - docs/**
      - README.md
      - nix/templates/default/README.md
      - nix/website.nix
      - flake.nix
      - flake.lock
      - .github/workflows/website.yml
  push:
    branches: [main]
    paths:
      - website/**
      - docs/**
      - README.md
      - nix/templates/default/README.md
      - nix/website.nix
      - flake.nix
      - flake.lock
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a running one is finished, not cancelled.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build site
        run: nix build .#packages.x86_64-linux.website
      # Writable copy outside the store, for the artifact.
      - name: Copy site
        if: github.event_name != 'pull_request'
        run: cp -rL --no-preserve=mode result _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
